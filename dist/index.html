:root{
  color-scheme:light;
  --paper:#f5f5f7;--ink:#1d1d1f;--soft:#62656d;--line:#e1e3e8;--white:#fff;
  --orange:#0068c9;--dark:#f9f9fb;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
}
body{background:linear-gradient(160deg,#f0f3f9 0,#f6f6f8 38%,#f5f5f7 80%);min-height:100vh;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:rgba(249,250,252,.88);color:var(--ink);border-bottom:1px solid #d9dce3;backdrop-filter:saturate(150%) blur(22px)}
.top,main{max-width:1480px;padding-inline:clamp(18px,4.4vw,70px)}.top{min-height:62px}
.brand{font-size:20px;letter-spacing:-.85px;gap:9px}
.mark{position:relative;display:inline-block;width:29px;height:29px;transform:none;border-radius:8px;background:linear-gradient(152deg,#7fcfff 0,#3687fb 45%,#3a55ce);box-shadow:inset 0 1px 1px #b2e3ff,0 2px 5px #33519128}
.mark::before,.mark::after{content:'';position:absolute;bottom:7px;width:4px;border-radius:3px;background:white;transform:skew(-13deg)}.mark::before{height:10px;left:8px}.mark::after{height:16px;left:16px}
.top .right{color:#414751;font:500 13px var(--sans);gap:8px}.avatar{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e1e8f2;color:#43526e;font:600 10px var(--sans)}
nav{align-self:center;gap:2px;border-radius:10px;background:#e8e9ed;padding:3px}
nav button{color:#41444d;min-width:78px;font-size:13px;font-weight:550;padding:6px 13px;border-radius:8px;line-height:1.5}
nav button[aria-current=page]{color:#191b20;background:white;box-shadow:0 1px 4px #1c253c24}
nav button[aria-current=page]:after{display:none}nav button:hover:not([aria-current=page]){background:#dde1e9}
.head{margin:29px 0 20px}.head h1{font-size:clamp(33px,3.2vw,46px);font-weight:690;letter-spacing:-1.8px}
.head .right{gap:8px;color:#51555d}.dot{background:#29905b}.dot.off{background:#b37224}
.outline,.tab,.chip{border-radius:8px;background:#f9fafc;border-color:#d4d7de}.outline:hover,.tab:hover,.chip:hover{background:#edf1f6}
#refresh{margin-left:6px;background:white;box-shadow:0 1px 2px #1f263410}#refresh::before{content:'↻';margin-right:5px;font-size:14px}
.summary{gap:12px;border:0;margin-bottom:15px}.summary .stat{position:relative;border:1px solid #e3e5ea;border-radius:15px;background:#fff;padding:15px 18px!important;box-shadow:0 2px 7px #172d5105;overflow:hidden}
.stat small:first-child{font-size:13px;font-weight:600;color:#4b505a}.stat strong{display:block;font-size:clamp(30px,3vw,41px);line-height:1.17;margin:5px 0 2px;font-weight:640;color:#1d1d1f}.stat small:last-child{font-size:12px}
.stat-symbol{position:absolute;top:14px;right:15px;display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#e7f1ff;color:#176ac8;font:600 16px/1 var(--sans)}
.stat:nth-child(2) .stat-symbol{color:#258456;background:#e5f5eb}.stat:nth-child(3) .stat-symbol{color:#a95b00;background:#fff1d9}.stat:nth-child(4) .stat-symbol{color:#8252b4;background:#f0e9fc}
.surface,.hero{border:1px solid #e1e3e9;border-radius:18px;background:white;box-shadow:0 3px 12px rgba(36,42,66,.045);padding:21px 23px}
.hero{background:linear-gradient(153deg,#fff 15%,#f6f9ff 78%,#eff5ff);color:#20232a;border-color:#dbe3f0}
.hero small,.hero .muted{color:#556373}.hero .charthead .mono{color:#59677b;font:600 11px var(--sans);letter-spacing:1.2px}
.loss{color:#17263d;font:600 41px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-1.7px;margin:11px 0 3px}
h2,.hero h2{font-size:21px;font-weight:650;letter-spacing:-.7px}.plot{margin-top:15px}.panels,.split,.library{gap:15px}
.mount{grid-template-columns:minmax(74px,.6fr) 1fr auto}.mount code{color:#333b47}.mount .mono{color:#425165;font-weight:550}.track{background:#edf0f5;height:7px}.fill{background:linear-gradient(90deg,#82bbff,#4388f5);border-radius:8px}.fill.hot{background:linear-gradient(90deg,#ffbc77,#e98b37)}
.link,.crumb button{color:#0069ca}.chip[aria-pressed=true],.tab[aria-pressed=true]{background:#e2efff;color:#075daa;border-color:#bfd7f5}

.crumb{gap:7px;color:#858992}.crumb button{color:#36678e}.entry,.job{border-bottom:1px solid #eceef2;border-radius:6px}.entry:hover,.job:hover{background:#f1f5fa}.chosen,.chosen:hover{background:#e2eeff;box-shadow:inset 3px 0 #468bf0}
.ico{background:linear-gradient(#72c8ff,#359dec);box-shadow:inset 0 -1px 1px #197fbb45;border-radius:2px}.ico:before{background:#86d1ff}.ico.file{background:#eef1f6;border:1px solid #adb7c5;box-shadow:none}
.file-emblem{position:relative;display:block;width:41px;height:30px;background:linear-gradient(#88d8ff,#3a9eea);border-radius:5px;margin:6px 0 14px}.file-emblem:before{content:'';position:absolute;width:18px;height:5px;top:-4px;left:0;background:#81cefa;border-radius:4px 4px 0 0}.file-emblem.doc{width:28px;height:33px;background:linear-gradient(#fff,#e3eaf3);border:1px solid #b6c0ce}.file-emblem.doc:before{top:9px;left:5px;width:16px;height:2px;background:#adbaca;box-shadow:0 5px #adbaca,0 10px #adbaca}
.badge{border-radius:20px}.completed,.running{background:#e3f3e9;color:#1d7245}.pending{background:#fff0d5;color:#855300}.failed{background:#ffe6e5;color:#ab3934}
th{background:#fafafb}th:first-child,td:first-child{padding-left:8px}.foot{border-color:#dedfe5}.sticky{top:76px}.inspect-title{letter-spacing:-.6px}

function chartTicks(min,max,intervals,integer=false){
 const rough=(max-min)/intervals;if(!(rough>0))return [min];
 const base=10**Math.floor(Math.log10(rough));
 const unit=[1,2,2.5,5,10].find(v=>v*base>=rough)||10;
 const step=Math.max(integer?1:0,unit*base),values=[];
 for(let k=Math.ceil(min/step);k<=Math.floor(max/step)&&values.length<20;k++)values.push(Number((k*step).toPrecision(12)));

}

 if(hi===lo){const pad=Math.abs(lo)*.02||.01;lo-=pad;hi+=pad}

 if(large){

 }else{
  c.fillText(axisNames[m.axis]+' '+xmin,l,h-4);if(xmin!==xmax){c.textAlign='right';c.fillText(String(xmax),r,h-4)}

function runProgress(progress, loggedEpoch){
 if(!progress)return '';
 const {step,total,stepsPerEpoch,epochEstimated}=progress;
 const track='<progress aria-label="训练步数" value="'+step+'" max="'+total+'"></progress>';
 let ruler='',caption='';
 if(stepsPerEpoch>0){
  const rounds=Math.ceil(total/stepsPerEpoch);
  const current=Math.min(rounds,Math.floor(step/stepsPerEpoch)+1);
  // Keep individual boundaries for typical runs and group very long schedules.
  const stride=Math.max(1,Math.ceil(rounds/60));
  const labelStride=stride*Math.ceil(rounds/(6*stride));
  let ticks='';
  for(let n=stride;n*stepsPerEpoch<total;n+=stride){
   const boundary=n*stepsPerEpoch,percent=100*boundary/total;
   const label=n%labelStride===0&&percent>7&&percent<93?'<span>'+n+'</span>':'';
   ticks+='<i style="left:'+percent+'%" title="第 '+n+' 轮结束 · '+(epochEstimated?'约 ':'')+'Step '+boundary.toLocaleString()+'">'+label+'</i>';
  }
  ruler='<div class="epoch-ruler" aria-label="已完成的轮数"><b>0</b>'+ticks+'<b>'+Number((total/stepsPerEpoch).toFixed(2))+'</b></div>';
  caption='<small class="epoch-caption">'+(epochEstimated?'约 · ':'')+'第 <b>'+current+'</b> / '+rounds+' 轮'+(step===total?' · 训练步数已完成':'')+'<span>每轮 '+(epochEstimated?'约 ':'')+stepsPerEpoch.toLocaleString()+' 步</span></small>';
 }else if(Number.isFinite(loggedEpoch)){
  caption='<small class="epoch-caption">最近记录 · Epoch '+esc(loggedEpoch)+'</small>';
 }
 return '<div class="run-progress"><strong>Step '+step.toLocaleString()+' / '+total.toLocaleString()+'</strong><span>'+Number((100*step/total).toFixed(2))+'%</span><div class="epoch-track">'+track+ruler+'</div>'+caption+'</div>';
}

function uploadMeter(t){

 const percent=done?100:moving&&Number.isFinite(t.percent)?Math.max(0,Math.min(100,t.percent)):null;

 const tone=done?'complete':failed?'failed':moving?'moving':t.state==='校验中'?'verify':'waiting';
 const total=t.bytes>0?(moving&&Number.isFinite(t.processedBytes)?fmt(Math.min(t.bytes,t.processedBytes))+' / ':'共 ')+fmt(t.bytes):'';
 const sampled=moving&&t.updated?'<small class="upload-sampled">进度更新于 '+esc(new Date(t.updated*1000).toLocaleTimeString('zh-CN',{hour12:false}))+'</small>':'';
 const label=uploadTarget(t)+' 上传进度';
 const bar=failed?'':'<div class="upload-track" role="progressbar" aria-label="'+label+'" aria-valuemin="0" aria-valuemax="100" '+
  (percent===null?'aria-valuetext="'+attr(phase)+'"':'aria-valuenow="'+percent+'"')+'><i style="--filled:'+(percent===null?'25':percent)+'%"></i></div>';
 return '<div class="upload-meter '+tone+(percent===null?' indeterminate':'')+'"><div class="upload-caption"><span><i aria-hidden="true"></i>'+esc(uploadTarget(t)+' · '+phase)+'</span><span>'+

function sinceEstimate(epoch,stamp){
 if(!epoch)return '未给出';
 const minutes=Math.max(0,Math.round((epoch-stamp)/60));
 if(minutes<1)return '不足 1 分钟';
 const h=Math.floor(minutes/60),d=Math.floor(h/24);
 return d?d+' 天 '+(h%24)+' 小时':h?h+' 小时 '+(minutes%60)+' 分钟':minutes+' 分钟'
}

}

function queueReason(value){const raw=(value||'').replace(/^\(|\)$/g,'');const map={Priority:'优先级',Resources:'等待资源',Dependency:'依赖未完成',DependencyNeverSatisfied:'依赖无法满足',JobHeldUser:'用户暂停',ReqNodeNotAvail:'请求节点不可用'};return map[raw]?map[raw]+' · '+raw:raw||'—'}
function queuePurpose(job){

 const parts=file.split('/').filter(Boolean),script=parts.at(-1)||'',folder=parts.at(-2)||'';

 :has(/(?:^|[\s_.\/-])(?:test|probe|smoke|preflight)(?:$|[\s_.\/-])/) ? '测试'
 :has(/(?:^|[\s_.\/-])(?:train(?:ing)?|sft|finetune|pretrain)(?:$|[\s_.\/-])/) ? '训练'
 :has(/(?:^|[\s_.\/-])(?:infer(?:ence)?|predict)(?:$|[\s_.\/-])/) ? '推理'
 :has(/(?:^|[\s_.\/-])(?:summary|audit|analyze)(?:$|[\s_.\/-])/) ? '分析':'';
 const context=folder&&!['bin','scripts','jobs','home','tmp','work','scratch'].includes(folder)&&folder!==job.user?folder:'';
 return {kind,context};
}

 const tiles='<div class="summary">'+counts.map(([k,v])=>'<div class="stat"><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>';
 const nodes=c.nodes.map(n=>'<article class="surface node"><div class="line"><h2>'+esc(n.name)+'</h2>'+nodeBadge(n.state)+'</div><small>'+esc(n.hardware)+'</small>'+resourceGrid(n)+(n.reason&&n.reason!=='none'?'<p class="feedback">'+esc(n.reason)+'</p>':'')+(n.jobs.length?'<div class="node-jobs">'+n.jobs.map(j=>nodeJob(j,c.owner,c.stamp)).join('')+'</div>':'<p class="empty">未见已分配作业</p>')+'</article>').join('');
 const queue='<section class="surface below queue-board"><h2>排队用户与作业</h2><div class="tools">'+button('quser','','全部 · '+pending.length,'chip','aria-pressed="'+(!queueUser)+'"')+sorted.map(([u,n])=>'<span class="queue-person-chip">'+personLabel(u,false)+button('quser',u,String(n),'chip','aria-label="筛选 '+attr(u)+' 的 '+n+' 个排队作业" title="筛选此用户的排队作业" aria-pressed="'+(queueUser===u)+'"')+'</span>').join('')+'</div>'+tableMarkup(['用户 / 作业号','任务与启动命令','状态与原因','分区 / 资源','申请时限','提交时间 <small class="tz">'+esc(c.zone)+'</small>','预计开始 <small class="tz">'+esc(c.zone)+'</small>'],filtered.slice(queuePage*25,queuePage*25+25).map(j=>pendingRow(j,c.owner,c.zone)))+pageControls('qpage',queuePage,filtered.length,25)+'</section>';
 return '<div class="line cluster-time"><small>'+esc(clusterError?clusterError+' · 保留上次采样':'每 15 秒更新')+' · '+displayTime(c.stamp)+' · 队列时间 '+esc(c.zone)+'</small>'+button('resample',1,'立即采样','link')+'</div>'+tiles+predictionPanel(c)+priorityPanel(c)+'<div class="node-grid">'+nodes+'</div>'+queue
}
function setResource(tab,path=''){assetTab=tab;groupPath=path;assetQuery='';groupIndex=0;assetPage=[0,0];navigate(3)}
function locationState(){if(location.hash==='#all')history.replaceState(null,'','#overview');const [section,sub,p]=location.hash.slice(1).split('/');page=Math.max(0,pages.indexOf(section));assetTab=sub==='datasets'?'datasets':'ck';try{groupPath=assetTab==='ck'&&p?decodeURIComponent(p):''}catch{groupPath=''}}
function setTheme(choice){let dark=choice==='system'?matchMedia('(prefers-color-scheme: dark)').matches:choice==='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').value=choice;draw()}
function savedTheme(){try{return localStorage.getItem('h800-theme')||'system'}catch{return 'system'}}
async function copyPath(b,path){
 const label=b.classList.contains('copy-path')?'复制路径':'复制';
 try{await navigator.clipboard.writeText(path)}
 catch{
  const f=document.createElement('textarea');f.value=path;b.after(f);f.select();
  if(!document.execCommand('copy')){b.textContent='请复制选中文字';f.addEventListener('blur',()=>{f.remove();b.textContent=label},{once:true});return}
  f.remove();b.focus({preventScroll:true});
 }
 b.textContent='已复制';clearTimeout(b.copyReset);b.copyReset=setTimeout(()=>b.textContent=label,1400);
}

let pendingPage=false,loaderTimer;
function beginPageLoad(){
 if(pendingPage)return;
 pendingPage=true;
 $('content').setAttribute('aria-busy','true');
 loaderTimer=setTimeout(()=>{ $('pageLoader').hidden=false;$('content').inert=true },180);
}
function finishPageLoad(){
 clearTimeout(loaderTimer);pendingPage=false;
 $('pageLoader').hidden=true;$('content').inert=false;$('content').removeAttribute('aria-busy');
}
async function render(navigation=false){
 if(navigation&&$('profileDialog').open)$('profileDialog').close();
 if(navigation&&$('metricDialog').open)$('metricDialog').close();
 const g=++generation;chartPoints.clear();if(navigation)beginPageLoad();
 document.body.classList.toggle('atlas-home',page===0);$('title').textContent=page===0?'H800 Atlas':page===5?'使用指南':names[page];$('cover-meta').hidden=page!==0;$('cover-meta').innerHTML=[overview.user&&personLabel(overview.user)+' 的工作台',overview.stamp&&new Date(overview.stamp*1000).toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})].filter(Boolean).join('  ·  ');$('nav').innerHTML=names.map((n,i)=>button('page',i,n,'',i===page?'aria-current="page"':'')).join('');
 document.body.classList.toggle('atlas-guide',page===5);
 if(page===5&&live){renderGuide(navigation);finishPageLoad();return}
 if(page!==5&&document.querySelector('.handbook')){leaveGuide();window.scrollTo(0,0)}
 if(!live){
  $('content').innerHTML='<section class="surface"><h2>H800 实时连接</h2><p class="empty">'+(syncing?'正在读取 H800…':'等待连接，点击刷新重试。')+'</p></section>';
  if(!syncing)finishPageLoad();
  return;
 }
 try{
  if(page===0){
   if(!studio.ready)$('content').innerHTML=dashboardOverview()+'<section class="surface"><p class="studio-empty" role="status">正在读取作业时间线与资源图表…</p></section>';
   await loadStudio();if(g!==generation)return;
  }
  const html=page===0?dashboard():page===1?await filesView(g):page===2?runs():page===4?await clusterView():await resourceView();
  if(g!==generation)return;
  $('content').innerHTML=html;if(page===3&&assetTab==='ck')refreshTransferViews();draw();
  if(page===2&&selectedJob)await loadDetail(jobList.find(j=>j.id===selectedJob),g);
 }catch(e){
  if(g===generation)$('content').innerHTML='<p class="surface feedback">'+esc(e.message)+' '+button('page',page,'重试','link')+' '+(page===1?button('root',H,'返回 home','link'):'')+'</p>';
 }finally{if(g===generation)finishPageLoad()}
}
function navigate(n){page=n;const target='#'+pages[n]+(n===3?(assetTab==='ck'?'/checkpoints'+(groupPath?'/'+encodeURIComponent(groupPath):''):'/datasets'):'');if(location.hash!==target)history.pushState(null,'',target);render(true)}
function openDir(p){dir=p;selectedFile='';offset=0;query='';navigate(1)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.linkrun)openRunLink(d.linkrun);
 else if(d.expand)openMetric(b);
 else if(d.assetnav)setResource(d.assetnav);
 else if(d.robot!==undefined){robotFilter=d.robot;assetPage[0]=0;render()}
 else if(d.nascheckpoints){ckStore='NAS';setResource('ck')}
 else if(d.openscan){$('ckScanDialog').showModal();$('ckScanPath').focus()}
 else if(d.ckstore){ckStore=d.ckstore;groupIndex=0;render()}
 else if(d.removeck)await removeLocal(b,d.removeck);
 else if(d.group)setResource('ck',d.group);
 else if(d.backgroups)setResource('ck');
 else if(d.gpage!==undefined){groupIndex=+d.gpage;render()}
 else if(d.upload)await sendCheckpoint(b,d.upload);
 else if(d.grus)await sendCheckpoint(b,d.grus,'Grus');
 else if(d.inspectcmd)await showCommand(d.inspectcmd);
 else if(d.ranktoggle){rankOpen=!rankOpen;render()}
 else if(d.copy)await copyPath(b,d.copy);
 else if(d.quser!==undefined){queueUser=d.quser;queuePage=0;render()}
 else if(d.qpage!==undefined){queuePage=+d.qpage;render()}
 else if(d.resample){await fetchCluster();if(page===4)render()}
 else if(d.page==='3')setResource('ck');
 else if(d.page!==undefined)navigate(+d.page);
 else if(d.job){
   if(page!==2){selectedState='';selectedJob=d.job;navigate(2)}
   else{
     const j=jobList.find(x=>x.id===d.job);if(!j)return;
     selectedJob=d.job;const g=++generation;finishPageLoad();
     document.querySelectorAll('.job[data-job]').forEach(el=>el.classList.toggle('chosen',el===b));
     $('runDetail').innerHTML=sourceDetail(j);draw();loadDetail(j,g,true);
     if(matchMedia('(max-width:700px)').matches)$('runDetail').scrollIntoView({block:'start'});
   }
 }
 else if(d.state!==undefined){selectedState=d.state;render()}
 else if(d.root)openDir(d.root);
 else if(d.offset!==undefined){offset=+d.offset;render()}
 else if(d.entry!==undefined){let f=fileRows[+d.entry];if(f.directory){let next=f.target&&roots.some(r=>f.target===r||f.target.startsWith(r+'/'))?f.target:f.path;openDir(next)}else{selectedFile=f.path;$('fileDetail').innerHTML=fileInfo(f);document.querySelectorAll('[data-entry]').forEach(el=>el.classList.toggle('chosen',el===b))}}
 else if(d.ap){let [i,n]=d.ap.split(':').map(Number);assetPage[i]=n;render()}
 else if(d.measure){b.disabled=true;b.textContent='统计中…';try{let v=await api('size',{path:d.measure});let s=v.bytes==null?v.note:fmt(v.bytes);if(v.bytes!=null)sizes.set(d.measure,s);b.textContent=s}catch{b.textContent='统计失败，再试一次'}b.disabled=false}
});
document.addEventListener('change',e=>{if(e.target.id==='rankPartition'){rankPartition=e.target.value;render()}if(e.target.id==='ds-store'){storeFilter=e.target.value;robotFilter='';assetPage[0]=0;render()}});document.addEventListener('submit',e=>{e.preventDefault();let q=new FormData(e.target).get('q')||'';if(e.target.id==='finder'){query=q;offset=0}else if(e.target.id==='assetFinder'){assetQuery=q;groupIndex=0;assetPage=[0,0]}render()});
$('ckScanClose').onclick=()=>$('ckScanDialog').close();
$('ckScanForm').onsubmit=async e=>{
 e.preventDefault();e.stopPropagation();
 const submit=$('ckScanSubmit');if(submit.disabled)return;
 const path=$('ckScanPath').value.trim();
 submit.disabled=true;$('ckScanFeedback').textContent='正在检索…';
 try{
  const response=await atlasFetch('/api/checkpoint-scan',{method:'POST',headers:{'Content-Type':'application/json','X-Atlas-Action':'checkpoint-scan'},body:JSON.stringify({path})});
  if(response.status===401){loginPage();return}
  const data=await response.json();if(!response.ok)throw Error(data.error||'检索失败');
  ckSources=null;groupDetails.clear();groupList=await api('checkpoint-groups');inventoryFetched=0;
  ckStore='H800';groupPath='';assetQuery=data.path;groupIndex=0;
  $('ckScanFeedback').textContent='找到 '+data.count+' 个 checkpoint'+(data.skipped?'，跳过 '+data.skipped+' 个不可读目录':'');
  if(page===3&&assetTab==='ck'){history.replaceState(null,'','#assets/checkpoints');await render()}
 }catch(error){$('ckScanFeedback').textContent=error.message}
 finally{submit.disabled=false}
};
async function sync(){
 if(syncing)return;syncing=true;if(!live)beginPageLoad();
 try{const o=await api('overview');overview=o;if(!H){H=o.home;dir=H;roots=o.roots}$('account').textContent=o.user;$('account').dataset.profile=o.user;$('initials').innerHTML=userAvatar(o.user);live=true;syncAvatars();$('mode').textContent='实时 · '+o.host;$('dot').className='dot';$('status').textContent='H800 采样于 '+displayTime(o.stamp);
 const [jobsResult,groupsResult]=await Promise.allSettled([api('jobs'),api('checkpoint-groups')]);asset=null;groupDetails.clear();ckSources=null;nasWhen=0;runCache.clear();
 jobsAvailable=jobsResult.status==='fulfilled';if(jobsAvailable)jobList=jobsResult.value;else $('status').textContent+=' · Slurm 作业读取失败';
 groupList=groupsResult.status==='fulfilled'?groupsResult.value:null;
 await render();refreshMyInventory()
 }catch{const cached=live;$('mode').textContent='连接中断';$('dot').className='dot off';$('status').textContent=cached?'最后成功读取 '+displayTime(overview.stamp):'无法连接 H800，请重连 SSH 后刷新。';if(!cached){syncing=false;await render()}}finally{syncing=false}
}
$('logout').onclick=async()=>{const r=await atlasFetch('/auth/logout',{method:'POST',headers:{'X-Atlas-Action':'logout'}});if(r.ok||r.status===401)loginPage();else $('status').textContent='退出失败，请重试'};
let versionCheck=false;
async function checkVersion(){
 if(versionCheck||document.hidden)return;
 versionCheck=true;
 try{const v=await api('version');if(v.release!==document.querySelector('meta[name="atlas-release"]').content)location.reload()}catch{}finally{versionCheck=false}
}
setInterval(checkVersion,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
if(teamHttp&&!sessionStorage.getItem('atlas-session'))loginPage();else {
setInterval(pollRuns,10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollRuns()});setInterval(pollTransfers,4500);locationState();setTheme(savedTheme());$('theme').onchange=e=>{let choice=e.target.value;try{localStorage.setItem('h800-theme',choice)}catch{}setTheme(choice)};matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if($('theme').value==='system')setTheme('system')});window.addEventListener('popstate',()=>{locationState();render(true)});setInterval(async()=>{if(page===4&&live&&!document.hidden){await fetchCluster();if(page===4)render()}},15000);$('refresh').onclick=sync;window.addEventListener('resize',draw);render();sync();setInterval(()=>{if(live&&!document.hidden&&page===0)sync()},60000)
}
</script></body></html>
