<template id="guideTemplate"><article class="handbook"><div class="book-cover"><small>H800 Atlas</small><h1>使用指南</h1><p>训练、数据、权重与集群调度的操作说明。</p></div><div class="book-layout"><aside class="book-toc" aria-label="章节目录"><strong>本页目录</strong><div><a href="#guide/start">登录与工作台</a><a href="#guide/training">训练记录</a><a href="#guide/data">文件与共享数据集</a><a href="#guide/weights">Checkpoints 与 NAS</a><a href="#guide/cluster">集群与排队</a><a href="#guide/profile">账户与个人统计</a></div></aside><div><section class="book-chapter" data-chapter="start"><h2>登录与工作台</h2><p>用自己的 H800 SSH 账号登录。同事打开同一个站点后，会进入各自的工作台。</p><h3>登录</h3><p>连接团队内网或 VPN，打开团队提供的 Atlas 地址，输入自己的 SSH 用户名和密码。登录后先核对右上角账号，再看工作台右上方的连接状态和页底采样时间。</p><figure><button type="button" class="book-shot" aria-label="放大截图：H800 Atlas 的实际登录页面" style="--shot-ratio:1280/900"><img data-image="login" width="1280" height="900" alt="H800 Atlas 的实际登录页面"></button><figcaption>H800 Atlas 的实际登录页面</figcaption></figure><h3>作业与存储</h3><p>首页四个数字分别汇总作业记录、运行中、排队中和 Checkpoints。存储面板中，/home 按个人 30 GiB 配额展示，/workspace 等共享卷显示整卷可用空间。同事往共享卷写入数据也会改变这个数字。</p><figure><button type="button" class="book-shot" aria-label="放大截图：个人配额与共享卷余量" style="--shot-ratio:1168/194"><img data-image="storage" width="1168" height="194" alt="个人配额与共享卷余量"></button><figcaption>个人配额与共享卷余量</figcaption></figure><h3>回看最近的训练</h3><p>在「我的作业时间线」沿横轴查看等待与运行区间，点击任务名称进入训练记录。页面底部的「集群训练用量」支持切换统计周期和排序指标。</p><figure><button type="button" class="book-shot" aria-label="放大截图：时间线的颜色对应图例，横轴为实际时间" style="--shot-ratio:1168/560"><img data-image="timeline" width="1168" height="560" alt="时间线的颜色对应图例，横轴为实际时间"></button><figcaption>时间线的颜色对应图例，横轴为实际时间</figcaption></figure><footer><a href="#overview">打开工作台 ↗</a><button type="button" data-guide-link="start">复制本章链接</button></footer></section>
<section class="book-chapter" data-chapter="training"><h2>训练记录</h2><p>从 Slurm 作业找到具体的训练尝试，再读进度和每一步的指标。</p><h3>判断一次训练的结果</h3><p>进入「训练记录」，在左侧选择作业。以 #15467 为例，同一次 GPU 分配中启动过两次训练。第一次退出码为 1，第二次完成了 24,660 步、12 个 epoch。训练结束后才取消保留 GPU 的作业，两种状态就会同时出现。判断模型是否训完，要看最后一次训练尝试的结果。</p><figure><button type="button" class="book-shot" aria-label="放大截图：作业 #15467 的尝试记录与 epoch 刻度" style="--shot-ratio:740/650"><img data-image="training" width="740" height="650" alt="作业 #15467 的尝试记录与 epoch 刻度"></button><figcaption>作业 #15467 的尝试记录与 epoch 刻度</figcaption></figure><h3>读进度和剩余时间</h3><p>进度条上方是当前步数和计划总步数，下方刻度标出各个 epoch 的大致边界。运行中的训练会定期读取日志。有近期迭代耗时和总步数时，Atlas 可估算自己的训练还要多久。重启、评估和保存权重都会使估算波动。</p><h3>检查曲线的波动</h3><p>点击损失、学习率、梯度范数或每步耗时卡片放大。沿横轴移动鼠标，用竖虚线读取采样位置和值。打开「平滑」，拖动强度滑杆观察长期趋势；关闭平滑可检查原始尖峰。可见指标取决于这次训练记录了什么。自动发现不到 W&amp;B run 或出现多个候选时，点击「关联 W&amp;B run」，选择候选或填写 run 目录、.wandb 文件的绝对路径，然后保存。再次打开此作业会使用已保存的关联。</p><figure><button type="button" class="book-shot" aria-label="放大截图：曲线大图中的平滑强度与采样提示" style="--shot-ratio:1000/580"><img data-image="curve" width="1000" height="580" alt="曲线大图中的平滑强度与采样提示"></button><figcaption>曲线大图中的平滑强度与采样提示</figcaption></figure><footer><a href="#runs">打开训练记录 ↗</a><button type="button" data-guide-link="training">复制本章链接</button></footer></section>
<section class="book-chapter" data-chapter="data"><h2>文件与共享数据集</h2><p>在文件管理中定位目录，在资源目录中按任务名称找训练数据。</p><h3>浏览目录</h3><p>进入「文件管理」，选择顶部的根目录，逐级打开文件夹。面包屑可以返回上级，搜索框在当前目录内查找。选中文件可查看路径和属性，目录大小可按需统计。</p><figure><button type="button" class="book-shot" aria-label="放大截图：文件管理中的 Bodypipeline 机器人目录" style="--shot-ratio:1168/438"><img data-image="files" width="1168" height="438" alt="文件管理中的 Bodypipeline 机器人目录"></button><figcaption>文件管理中的 Bodypipeline 机器人目录</figcaption></figure><h3>选择机器人和数据版本</h3><p>进入「资源目录 → Datasets」，选择存储位置，再点击机器人按钮，例如 ARX_X5。输入任务名或部分路径搜索。同名任务可能对应不同的转换版本，请核对更新时间，悬停「复制路径」可查看完整路径，点击即可复制到训练配置中。</p><figure><button type="button" class="book-shot" aria-label="放大截图：ARX_X5 数据集的实际任务名和完整路径" style="--shot-ratio:1120/125"><img data-image="dataset" width="1120" height="125" alt="ARX_X5 数据集的实际任务名和完整路径"></button><figcaption>ARX_X5 数据集的实际任务名和完整路径</figcaption></figure><footer><a href="#assets/datasets">打开数据集 ↗</a><button type="button" data-guide-link="data">复制本章链接</button></footer></section>
<section class="book-chapter" data-chapter="weights"><h2>Checkpoints 与 NAS</h2><p>按训练任务找到权重，确认保存步和副本位置，再决定是否释放空间。</p><h3>从任务进入权重详情</h3><p>进入「资源目录 → Checkpoints」，筛选 H800 或 NAS，点击训练输出目录。逐项核对 Step、Epoch、loss 和学习率。「最近记录」会注明实际采样步，空值表示缺少对应记录。每个副本都可单独复制路径。</p><figure><button type="button" class="book-shot" aria-label="放大截图：权重详情中的来源、保存步与路径" style="--shot-ratio:1168/543"><img data-image="checkpoint" width="1168" height="543" alt="权重详情中的来源、保存步与路径"></button><figcaption>权重详情中的来源、保存步与路径</figcaption></figure><h3>检索其他输出目录</h3><p>列表里找不到某次训练时，点击「按路径检索」，粘贴自己的 H800 训练输出目录。开始检索后，回到任务列表，打开相应父目录查看识别到的权重。</p><figure><button type="button" class="book-shot" aria-label="放大截图：检索自己的 H800 输出目录" style="--shot-ratio:480/274"><img data-image="scan" width="480" height="274" alt="检索自己的 H800 输出目录"></button><figcaption>检索自己的 H800 输出目录</figcaption></figure><h3>上传和清理</h3><p>选中 H800 上的目标 checkpoint，点击「上传到 NAS」，在传输记录中查看进度。完成后核对「已上传 NAS · 已校验」和 NAS 目标路径。校验通过且本地副本仍存在时，会出现「删除 H800 本地副本」。确认路径后再删除，上传本身会保留原文件。</p><footer><a href="#assets/checkpoints">打开Checkpoints ↗</a><button type="button" data-guide-link="weights">复制本章链接</button></footer></section>
<section class="book-chapter" data-chapter="cluster"><h2>集群与排队</h2><p>先看是否有匹配的资源，再看自己的作业因什么原因等待。</p><h3>读懂节点卡片</h3><p>每个节点并列显示 GPU 和 CPU 的资源条。比较总量、已分配和空闲，再看下方作业的使用人、运行时长、申请时限及资源数。「已分配」代表调度器预留的资源量，GPU 即使暂时没有计算，也可能仍被作业占用。</p><figure><button type="button" class="book-shot" aria-label="放大截图：节点卡片中的资源条与运行作业" style="--shot-ratio:577/464"><img data-image="node" width="577" height="464" alt="节点卡片中的资源条与运行作业"></button><figcaption>节点卡片中的资源条与运行作业</figcaption></figure><h3>查看排队作业</h3><p>在「排队用户与作业」找到高亮的本人作业，核对申请的 GPU、CPU、内存和节点约束。Resources 表示等待可匹配的资源，Priority 表示受优先级影响。点击命令按钮可查看可读取的启动信息。</p><h3>理解预计时间</h3><p>调度规则面板展示当前配置和可用的优先级信息。选择对应分区，查看自己的作业位置。预计开始时间会随排队情况变化。自己的预计训练完成时间取决于迭代进度，其他用户显示的申请时限只代表预留时长。</p><figure><button type="button" class="book-shot" aria-label="放大截图：调度规则随本集群的实际配置更新" style="--shot-ratio:1168/347"><img data-image="policy" width="1168" height="347" alt="调度规则随本集群的实际配置更新"></button><figcaption>调度规则随本集群的实际配置更新</figcaption></figure><footer><a href="#cluster">打开集群看板 ↗</a><button type="button" data-guide-link="cluster">复制本章链接</button></footer></section>
<section class="book-chapter" data-chapter="profile"><h2>账户与个人统计</h2><p>从右上角管理自己的头像和简介，从作业列表查看团队成员的公开名片。</p><h3>使用账户菜单</h3><p>点击右上角圆形头像可打开「我的名片」、编辑个人信息、阅读使用指南或退出登录。点击旁边的用户名也可打开账户菜单。其他页面中的人名可直接打开名片。在编辑界面可更换头像，填写最多 240 字的团队可见简介。上传照片后，拖动照片并用滑杆缩放，圆圈标出保存范围。确认预览后点击「保存头像」。</p><figure><button type="button" class="book-shot" aria-label="放大截图：导航栏头像展开后的账户菜单" style="--shot-ratio:212/249"><img data-image="menu" width="212" height="249" alt="导航栏头像展开后的账户菜单"></button><figcaption>导航栏头像展开后的账户菜单</figcaption></figure><h3>看懂统计口径</h3><p>点击工作台或集群看板中的人名，在名片里切换近 7 天和近 30 天。GPU 卡时考虑分配的卡数，累计时长按作业计。成功率以已结束训练为分母，有明确训练结果时按训练结果统计，缺少训练证据时参考调度状态。名片下方分别列出共享数据集和个人训练资源。</p><figure><button type="button" class="book-shot" aria-label="放大截图：个人名片同时显示成功次数与已结束次数" style="--shot-ratio:541/576"><img data-image="profile" width="541" height="576" alt="个人名片同时显示成功次数与已结束次数"></button><figcaption>个人名片同时显示成功次数与已结束次数</figcaption></figure><footer><a href="#overview">打开工作台 ↗</a><button type="button" data-guide-link="profile">复制本章链接</button></footer></section><small>页面实拍于 2026 年 11 月 14 日（北京时间）。作业、排队和存储数字以你登录时的页面为准。</small></div></div></article></template>
