<script>
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('submit'),error=document.getElementById('error'),password=document.getElementById('password');
 button.disabled=true;button.textContent='正在验证…';error.textContent='';
 try{
  const response=await fetch('/auth/login',{method:'POST',signal:AbortSignal.timeout(30000),headers:{'Content-Type':'application/json','X-Atlas-Action':'login'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:password.value})});
  if(!response.ok){const v=await response.json();throw Error(v.error||'登录失败')}
  password.value='';
  if('__ATLAS_TEAM_HTTP__'==='yes'){
   const {session}=await response.json();sessionStorage.setItem('atlas-session',session);
   location.replace('/'+location.hash);
  }else location.reload()
 }catch(err){error.textContent=err.name==='TimeoutError'?'H800 登录响应超时，请稍后重试。':err.message;password.focus();password.select()}
 finally{button.disabled=false;button.textContent='登录'}
});
</script></body></html>
